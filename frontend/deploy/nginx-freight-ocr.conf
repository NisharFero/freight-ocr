# /etc/nginx/conf.d/freight-ocr.conf — TLS in front of the app (app listens on 127.0.0.1:3000 only)
# RHEL SELinux: allow nginx to reach the app once:  setsebool -P httpd_can_network_connect 1
limit_req_zone $binary_remote_addr zone=fo_api:10m rate=30r/m;

server {
    listen 80;
    server_name freight-ocr.example.local;            # <- change
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name freight-ocr.example.local;            # <- change
    ssl_certificate     /etc/pki/tls/certs/freight-ocr.crt;      # <- internal CA / company cert
    ssl_certificate_key /etc/pki/tls/private/freight-ocr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;        # matches the app's 25 MB per-file limit
    proxy_read_timeout 300s;         # a sideways multi-page scan can take ~45 s; a batch longer
    proxy_send_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/extract {
        limit_req zone=fo_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/freight-ocr.proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/conf.d/freight-ocr.proxy_params;
    }
}
